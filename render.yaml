services:
  - type: web
    name: ai-writing-annotation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PER_GENRE
        value: "4"
      - key: ANNOTATOR_PASSWORD
        sync: false    # set in the Render dashboard, not stored in the repo
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
